<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Temperature Conversion Celsius to Fahrenheit</title>
        <link rel="stylesheet" href="practice1.css">
    </head>

    <body>        
        <main class="converter-card">
            <h1> Conversion Temperature </h1>
            <div class="inner-frame">
                <div class="input-group">

                    <label for="temp-input"> Input value: </label>
                    <input type="number" id="temp-input" placeholder="Enter value">
                </div>
            </div>

            <br>

            <div class="inner-frame">
                <label for="from-unit">From Unit:</label>
                <select id="from-unit" class="unit-select">
                    <option value="Celsius (°C)">Celsius (°C)</option>
                    <option value="Fahrenheit (°F)">Fahrenheit (°F)</option>
                    <option value="Kelvin (K)">Kelvin (K)</option>
                </select>
            </div>

            <br>

            <div class="inner-frame">
                <label for="to-unit">To Unit:</label>
                <select id="to-unit" class="unit-select">
                    <option value="Celsius (°C)">Celsius (°C)</option>
                    <option value="Fahrenheit (°F)">Fahrenheit (°F)</option>
                    <option value="Kelvin (K)">Kelvin (K)</option>
                </select>
            </div>

            <br>

            <div class="inner-frame">
                <label for="temp-output">  Output value: </label> 
                <div class="inner-frame">
                    <div class="output-group">
                        <p id="temp-output"></p>
                    </div>
                </div>
            </div>
        </main>

        <script src="practice1.js"></script>
    </body>
</html>
